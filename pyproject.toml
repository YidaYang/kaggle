[project]
name = "arena-ranker"
version = "0.1.0"
description = "Structured Qwen embedding classifier for ChatBot Arena preference prediction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "peft>=0.17.0",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.5.0",
  "torch>=2.4.0",
  "transformers>=4.55.0,<5",
  "tqdm>=4.66.0",
]

[project.scripts]
arena-train = "arena_ranker.train:main"
arena-predict = "arena_ranker.predict:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena_ranker"]
